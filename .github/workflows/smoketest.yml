name: Plugin Smoketest

# Reusable runtime smoketest: boots real WordPress via WordPress Playground with
# the calling plugin mounted + activated, then drives wp-admin with Playwright and
# fails if any admin page throws a PHP fatal / "critical error".
on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version for the WordPress runtime.
        type: string
        default: '8.3'
      wp-version:
        description: WordPress version (e.g. "latest", "6.6").
        type: string
        default: 'latest'
      plugin-name:
        description: Plugin display name to assert as active on plugins.php (optional).
        type: string
        default: ''
      harness-ref:
        description: Git ref of funke-pe/wp-plugin-smoketest to use.
        type: string
        default: 'main'
      cluster-plugins:
        description: >
          Whitespace-separated plugin slugs to install + activate from the cluster
          repo's plugins/ directory (e.g. "advanced-custom-fields-pro wordpress-seo-premium").
          Requires the cluster-repo-token secret.
        type: string
        default: ''
      cluster-repo:
        description: Repo holding the dependency plugins under plugins/.
        type: string
        default: 'wpcomvip/funke-fdpub'
    secrets:
      cluster-repo-token:
        description: Token with contents:read on the cluster repo.
        required: false

# To get failure details posted as a PR comment, the caller must grant:
#   permissions:
#     contents: read
#     pull-requests: write
# Without it the smoketest still runs; the comment step just logs a warning.
jobs:
  smoketest:
    name: WordPress Playground smoketest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin (caller repo)
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout smoketest harness
        uses: actions/checkout@v4
        with:
          repository: funke-pe/wp-plugin-smoketest
          ref: ${{ inputs.harness-ref }}
          path: smoketest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install harness dependencies
        working-directory: smoketest/harness
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Include optional per-plugin spec
        run: |
          if compgen -G "plugin/.smoketest/*.spec.ts" > /dev/null; then
            echo "Found per-plugin spec(s), adding to the suite."
            cp plugin/.smoketest/*.spec.ts smoketest/harness/tests/
          fi

      - name: Fetch cluster dependency plugins
        if: inputs.cluster-plugins != ''
        env:
          TOKEN: ${{ secrets.cluster-repo-token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::cluster-plugins is set but the cluster-repo-token secret is missing."
            exit 1
          fi
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${TOKEN}@github.com/${{ inputs.cluster-repo }}.git" cluster
          dirs=""
          for slug in ${{ inputs.cluster-plugins }}; do
            git -C cluster sparse-checkout add "plugins/$slug"
            dirs="$dirs $GITHUB_WORKSPACE/cluster/plugins/$slug"
          done
          echo "PLAYGROUND_EXTRA_PLUGIN_DIRS=$dirs" >> "$GITHUB_ENV"

      - name: Boot WordPress Playground
        working-directory: smoketest/harness
        env:
          PLAYGROUND_PHP: ${{ inputs.php-version }}
          PLAYGROUND_WP: ${{ inputs.wp-version }}
        run: |
          if [ -f "$GITHUB_WORKSPACE/plugin/.smoketest/blueprint.json" ]; then
            echo "Using per-plugin blueprint."
            export PLAYGROUND_BLUEPRINT="$GITHUB_WORKSPACE/plugin/.smoketest/blueprint.json"
          fi
          bash boot.sh "$GITHUB_WORKSPACE/plugin" "$GITHUB_WORKSPACE/playground.log"

      - name: Run smoketest
        working-directory: smoketest/harness
        env:
          SMOKE_BASE_URL: http://127.0.0.1:9400
          SMOKE_PLUGIN_NAME: ${{ inputs.plugin-name }}
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee "$GITHUB_WORKSPACE/playwright-output.txt"

      - name: Report failure on PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ Plugin Smoketest failed"
            echo
            if [ -s "$GITHUB_WORKSPACE/playwright-output.txt" ]; then
              echo "**Admin smoketest found a problem:**"
              echo '```'
              grep -vE "^\s*$" "$GITHUB_WORKSPACE/playwright-output.txt" | tail -n 25
              echo '```'
            else
              echo "**WordPress could not boot with this plugin — likely a PHP parse error or activation fatal:**"
              echo '```'
              grep -vE "^\s*$" "$GITHUB_WORKSPACE/playground.log" | tail -n 15
              echo '```'
            fi
            echo
            echo "_Full report: see the smoketest-report artifact on the [failed run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._"
          } > "$GITHUB_WORKSPACE/smoketest-comment.md"
          cat "$GITHUB_WORKSPACE/smoketest-comment.md" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file "$GITHUB_WORKSPACE/smoketest-comment.md" \
            --edit-last --create-if-none \
            || echo "::warning::Could not post PR comment (needs 'pull-requests: write' permission in the caller workflow)."

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoketest-report
          path: |
            smoketest/harness/playwright-report/
            smoketest/harness/test-results/
            playground.log
          retention-days: 7
          if-no-files-found: ignore
