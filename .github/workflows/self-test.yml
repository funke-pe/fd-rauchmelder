name: Harness Self-Test

# Guards the smoketest harness itself: proves it PASSES on a clean plugin and
# FAILS on a plugin that triggers a fatal. If either expectation breaks, the
# harness can no longer be trusted and this job goes red.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    name: Fixtures (clean must pass, broken must fail)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('harness/package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Clean fixture must PASS
        run: |
          bash boot.sh ./fixtures/clean-plugin /tmp/pg-clean.log
          SMOKE_BASE_URL=http://127.0.0.1:9400 SMOKE_PLUGIN_NAME="Clean Smoketest Fixture" npx playwright test
          kill "$(lsof -ti:9400)"

      - name: Clean fixture + dependency plugin dir must PASS (and be active)
        run: |
          # Verifies PLAYGROUND_EXTRA_PLUGIN_DIRS: mount local dir → activate.
          # Same mechanism the workflow uses for cluster-repo deps like ACF Pro.
          PLAYGROUND_EXTRA_PLUGIN_DIRS="./fixtures/dependency-plugin" \
            bash boot.sh ./fixtures/clean-plugin /tmp/pg-extra.log
          SMOKE_BASE_URL=http://127.0.0.1:9400 SMOKE_PLUGIN_NAME="Dependency Fixture" npx playwright test
          kill "$(lsof -ti:9400)"

      - name: Broken fixture (runtime fatal) must FAIL
        run: |
          bash boot.sh ./fixtures/broken-plugin /tmp/pg-broken.log
          if SMOKE_BASE_URL=http://127.0.0.1:9400 npx playwright test; then
            echo "::error::Harness did NOT catch the broken plugin's fatal — it is unreliable."
            kill "$(lsof -ti:9400)"
            exit 1
          fi
          echo "Broken fixture failed as expected."
          kill "$(lsof -ti:9400)"

      - name: Broken activation (parse error) must FAIL, fast
        run: |
          # A PHP parse error usually kills --auto-mount activation and the boot
          # (boot.sh must detect that QUICKLY — well under the full ~180s wait).
          # Playground is not fully deterministic though: sometimes the server
          # survives with the activation failed — then the smoketest itself must
          # go red. Either way: the harness has to catch the broken plugin.
          start=$(date +%s)
          if bash boot.sh ./fixtures/broken-activation-plugin /tmp/pg-activation.log; then
            echo "Boot survived the parse-error plugin — smoketest must catch it instead."
            if SMOKE_BASE_URL=http://127.0.0.1:9400 npx playwright test; then
              echo "::error::Harness did NOT catch the parse-error plugin."
              kill "$(lsof -ti:9400)" 2>/dev/null || true
              exit 1
            fi
            kill "$(lsof -ti:9400)" 2>/dev/null || true
            echo "Smoketest failed as expected."
            exit 0
          fi
          elapsed=$(( $(date +%s) - start ))
          echo "Parse-error plugin failed to boot as expected in ${elapsed}s."
          if [ "$elapsed" -ge 60 ]; then
            echo "::error::Boot took ${elapsed}s to fail — dead-process detection regressed (should be a few seconds)."
            exit 1
          fi
